<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{email/layout :: head}"></head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="background-color: #f4f4f4; padding: 20px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                   style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

                <th:block th:replace="~{email/layout :: header(${headerColor}, 'ATUALIZAÇÃO DO PEDIDO')}"></th:block>

                <tr>
                    <td style="padding: 30px 30px 10px 30px;">
                        <h2 style="color: #333; margin-top: 0;">Olá, <span th:text="${userName}">cliente</span>!</h2>
                        <p style="color: #666; font-size: 16px; line-height: 1.5;">
                            O status do seu pedido <strong>#<span th:text="${orderId}">0</span></strong> foi atualizado.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding: 10px 30px;">
                        <div th:style="'background-color: ' + ${headerColor} + '; border-radius: 50px; display: inline-block; padding: 12px 30px;'">
                            <span style="color: #ffffff; font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;"
                                  th:text="${statusLabel}">STATUS</span>
                        </div>
                    </td>
                </tr>

                <tr th:if="${statusMessage != null and !statusMessage.isBlank()}">
                    <td style="padding: 20px 30px 0 30px;">
                        <table width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="background-color: #f9f9f9; border-left: 4px solid #888; border-radius: 5px;">
                            <tr>
                                <td style="padding: 15px;">
                                    <p style="margin: 0; color: #888; font-size: 11px; text-transform: uppercase; font-weight: bold;">
                                        Detalhes</p>
                                    <p style="margin: 5px 0 0 0; color: #333; font-size: 14px;"
                                       th:text="${statusMessage}">Mensagem</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 20px 30px 0 30px;">
                        <p style="color: #888; font-size: 13px; margin: 0;">
                            Data do pedido: <strong th:text="${date}">data</strong>
                        </p>
                    </td>
                </tr>

                <th:block th:replace="~{email/layout :: button(${link}, 'Acompanhar Pedido')}"></th:block>
                <th:block th:replace="~{email/layout :: footer}"></th:block>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
