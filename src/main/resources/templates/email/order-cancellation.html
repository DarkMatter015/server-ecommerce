<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{email/layout :: head}"></head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="background-color: #f4f4f4; padding: 20px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                   style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

                <th:block th:replace="~{email/layout :: header('#dc3545', 'PEDIDO CANCELADO')}"></th:block>

                <tr>
                    <td style="padding: 30px 30px 10px 30px;">
                        <h2 style="color: #333; margin-top: 0;">Olá, <span th:text="${userName}">cliente</span>.</h2>
                        <p style="color: #666; font-size: 16px; line-height: 1.5;">Houve um problema ao processar seu
                            pedido e ele precisou ser cancelado.</p>
                        <table width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="background-color: #fff5f5; border-left: 4px solid #dc3545; margin: 20px 0;">
                            <tr>
                                <td style="padding: 15px;">
                                    <p style="margin: 0; color: #dc3545; font-size: 12px; font-weight: bold; text-transform: uppercase;">
                                        Motivo do Cancelamento</p>
                                    <p style="margin: 5px 0 0 0; color: #333; font-size: 14px;"
                                       th:text="${statusMessage}">Motivo</p>
                                </td>
                            </tr>
                        </table>
                        <p style="color: #666; font-size: 14px;">Caso tenha sido uma cobrança no cartão, o estorno será
                            realizado automaticamente.</p>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 0 30px;">
                        <h3 style="color: #777; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 16px;">
                            Resumo do Pedido #<span th:text="${orderId}">0</span>
                            <span style="font-size: 14px; font-weight: normal; color: #999; float: right;"
                                  th:text="${date}">data</span>
                        </h3>
                        <table width="100%" cellspacing="0" cellpadding="0" border="0">
                            <th:block th:replace="~{email/layout :: itemsRows}"></th:block>
                            <tr>
                                <td colspan="2" align="right"
                                    style="padding-top: 15px; color: #777; font-size: 14px;">Total Cancelado:
                                </td>
                                <td align="right"
                                    style="padding-top: 15px; color: #dc3545; font-weight: bold; font-size: 16px;"
                                    th:text="${total}">R$ 0,00</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <th:block th:replace="~{email/layout :: button(${link}, 'Ver Detalhes do Pedido')}"></th:block>
                <th:block th:replace="~{email/layout :: footer}"></th:block>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
