<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{email/layout :: head}"></head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="background-color: #f4f4f4; padding: 20px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                   style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

                <th:block th:replace="~{email/layout :: header('#0056b3', 'DOCUMENTO DISPONÍVEL')}"></th:block>

                <tr>
                    <td style="padding: 30px 30px 10px 30px;">
                        <h2 style="color: #333; margin-top: 0;">Olá, <span th:text="${userName}">cliente</span>!</h2>
                        <p style="color: #666; font-size: 16px; line-height: 1.5;">
                            Um novo documento foi anexado ao seu pedido
                            <strong>#<span th:text="${orderId}">0</span></strong> e já está disponível para consulta.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 10px 30px;">
                        <table width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="background-color: #f9f9f9; border-radius: 5px;">
                            <tr>
                                <td width="60" valign="middle" style="padding: 15px 0 15px 15px;">
                                    <div style="width: 44px; height: 44px; background-color: #0056b3; border-radius: 8px; text-align: center; line-height: 44px;">
                                        <span style="color: #ffffff; font-size: 20px;">&#128196;</span>
                                    </div>
                                </td>
                                <td valign="middle" style="padding: 15px;">
                                    <p style="margin: 0; color: #888; font-size: 11px; text-transform: uppercase; font-weight: bold;"
                                       th:text="${documentLabel}">Documento</p>
                                    <p style="margin: 5px 0 0 0; color: #333; font-size: 14px; font-weight: bold; word-break: break-all;"
                                       th:text="${documentName}">arquivo.pdf</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 10px 30px 0 30px;">
                        <p style="color: #888; font-size: 13px; margin: 0; line-height: 1.4;">
                            Para visualizar ou baixar o documento, acesse os detalhes do seu pedido.
                        </p>
                    </td>
                </tr>

                <th:block th:replace="~{email/layout :: button(${link}, 'Ver Pedido')}"></th:block>
                <th:block th:replace="~{email/layout :: footer}"></th:block>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
