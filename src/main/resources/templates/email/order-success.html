<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{email/layout :: head}"></head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="background-color: #f4f4f4; padding: 20px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                   style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

                <th:block th:replace="~{email/layout :: header('#28a745', 'PAGAMENTO APROVADO')}"></th:block>

                <tr>
                    <td style="padding: 30px 30px 10px 30px;">
                        <h2 style="color: #333; margin-top: 0;">Olá, <span th:text="${userName}">cliente</span>!</h2>
                        <p style="color: #666; font-size: 16px; line-height: 1.5;">Temos ótimas notícias! Seu pedido foi
                            processado com sucesso e logo será enviado.</p>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 0 30px;">
                        <table width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="background-color: #f9f9f9; border-radius: 5px; margin-bottom: 20px;">
                            <tr>
                                <td valign="top" width="50%" style="padding: 15px;">
                                    <p style="margin: 0; color: #888; font-size: 11px; text-transform: uppercase; font-weight: bold;">
                                        Forma de Pagamento</p>
                                    <p style="margin: 5px 0 0 0; color: #333; font-size: 14px; font-weight: bold;"
                                       th:text="${paymentMethod}">Processado</p>
                                </td>
                                <td valign="top" width="50%" style="padding: 15px; border-left: 1px solid #eee;">
                                    <p style="margin: 0; color: #888; font-size: 11px; text-transform: uppercase; font-weight: bold;">
                                        Envio via</p>
                                    <p style="margin: 5px 0 0 0; color: #333; font-size: 14px; font-weight: bold;"
                                       th:text="${shipmentMethod}">Calculando informações da entrega</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <th:block th:replace="~{email/layout :: orderBody}"></th:block>
                <th:block th:replace="~{email/layout :: button(${link}, 'Acompanhar Entrega')}"></th:block>
                <th:block th:replace="~{email/layout :: footer}"></th:block>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
