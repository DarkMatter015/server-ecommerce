<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">

    <!-- ======================= HEADER ======================= -->
    <tr th:fragment="header(bgColor, title)">
        <td th:style="'background-color: ' + ${bgColor} + '; padding: 20px; text-align: center;'">
            <h1 style="color: #ffffff; margin: 0; font-size: 24px;">RiffHouse</h1>
            <p style="color: #ffffff; margin: 5px 0 0 0; font-weight: bold; font-size: 14px; opacity: 0.9;"
               th:text="${title}">TÍTULO</p>
        </td>
    </tr>

    <!-- ======================= BUTTON ======================= -->
    <tr th:fragment="button(link, text)">
        <td align="center" style="padding: 30px;">
            <a th:href="${link}"
               style="background-color: #28a745; color: #ffffff; text-decoration: none; padding: 15px 30px; border-radius: 5px; font-weight: bold; font-size: 16px; display: inline-block;"
               th:text="${text}">Botão</a>
        </td>
    </tr>

    <!-- ======================= FOOTER ======================= -->
    <tr th:fragment="footer">
        <td style="background-color: #f4f4f4; padding: 20px; text-align: center; color: #888; font-size: 12px;">
            <p style="margin: 0;">RiffHouse Ecommerce</p>
            <p style="margin: 5px 0;">Obrigado por comprar conosco!</p>
        </td>
    </tr>

    <!-- ======================= ITEM ROWS ======================= -->
    <th:block th:fragment="itemsRows">
        <tr th:each="item : ${items}">
            <td width="20%" style="padding: 10px; border-bottom: 1px solid #eee;">
                <img th:src="${item.imageUrl}" alt="Produto" width="60" height="auto"
                     style="display: block; border-radius: 4px;">
            </td>
            <td width="50%"
                style="padding: 10px; border-bottom: 1px solid #eee; font-family: Arial, sans-serif; font-size: 14px; color: #333;">
                <strong th:text="${item.name}">Produto</strong><br>
                <span style="font-size: 12px; color: #777;">Qtd: <span th:text="${item.quantity}">1</span></span>
            </td>
            <td width="30%" align="right"
                style="padding: 10px; border-bottom: 1px solid #eee; font-family: Arial, sans-serif; font-size: 14px; color: #333;"
                th:text="${item.price}">R$ 0,00</td>
        </tr>
    </th:block>

    <!-- ======================= ORDER BODY (resumo + itens + endereço/totais) ======================= -->
    <th:block th:fragment="orderBody">
        <tr>
            <td style="padding: 0 30px;">
                <h3 style="color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 16px;">
                    Resumo do Pedido #<span th:text="${orderId}">0</span>
                    <span style="font-size: 14px; font-weight: normal; color: #999; float: right;"
                          th:text="${date}">data</span>
                </h3>
                <table width="100%" cellspacing="0" cellpadding="0" border="0">
                    <th:block th:replace="~{email/layout :: itemsRows}"></th:block>
                </table>
            </td>
        </tr>
        <tr th:if="${showAddress}">
            <td style="padding: 20px 30px;">
                <table width="100%" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                        <td valign="top" width="50%" style="padding-right: 15px;">
                            <h4 style="color: #333; margin-bottom: 10px; font-size: 14px;">Endereço de Entrega:</h4>
                            <p style="color: #666; font-size: 13px; line-height: 1.4; margin: 0;"
                               th:text="${address}">endereço</p>
                        </td>
                        <td valign="top" width="50%">
                            <table width="100%" cellspacing="0" cellpadding="5">
                                <tr>
                                    <td style="color: #666; font-size: 13px;">Subtotal:</td>
                                    <td align="right" style="color: #333; font-size: 13px;" th:text="${subtotal}">R$ 0,00</td>
                                </tr>
                                <tr>
                                    <td style="color: #666; font-size: 13px;">Frete:</td>
                                    <td align="right" style="color: #333; font-size: 13px;" th:text="${shipping}">R$ 0,00</td>
                                </tr>
                                <tr>
                                    <td style="color: #333; font-weight: bold; font-size: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
                                        Total:
                                    </td>
                                    <td align="right"
                                        style="color: #28a745; font-weight: bold; font-size: 15px; border-top: 1px solid #ccc; padding-top: 10px;"
                                        th:text="${total}">R$ 0,00</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </th:block>

</table>
</body>
</html>
